<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>Chat with AskBot - AI Assistant | Real-time AI Conversations</title>
    <meta name="description" content="Start chatting with AskBot AI assistant. Get real-time intelligent responses powered by Google Gemini AI technology.">
    <meta name="keywords" content="AI chat, chatbot interface, real-time AI, Google Gemini, AskBot chat">
    <meta name="author" content="Karthik - MSRIT Bangalore">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://askbot-2-o.vercel.app/chat.html">
    
    <!-- Favicon Links -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#cd3e51">
    
    <!-- 🔥 CRITICAL: Load main styles.css for dark mode variables -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- 🌙 Dark Mode Detection Script (Run immediately to prevent flash) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const isDark = savedTheme === "dark" || (!savedTheme && prefersDark);
            
            if (isDark) {
                document.documentElement.classList.add("dark-mode");
                document.body.classList.add("dark-mode");
            }
        })();
    </script>
    
    <style>
        /* Chat-specific styles with dark mode support */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .chat-header {
            background: var(--gradient-primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-medium);
            position: relative;
        }
        
        .chat-header h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .back-to-home {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .back-to-home:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
            color: white;
            text-decoration: none;
        }
        
        /* 🌙 Theme Toggle Button in Header */
        .theme-toggle-chat {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .theme-toggle-chat:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 1rem;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--bg-secondary);
        }
        
        .message {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            max-width: 80%;
        }
        
        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .bot-message {
            align-self: flex-start;
        }
        
        .message i {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .bot-message i {
            background: var(--gradient-primary);
            color: white;
        }
        
        .user-message i {
            background: var(--gradient-secondary);
            color: white;
        }
        
        .message-content {
            background: var(--bg-primary);
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            color: var(--text-primary);
            line-height: 1.5;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-color);
        }
        
        .user-message .message-content {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .chat-input-container {
            padding: 1.5rem;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
        }
        
        .chat-input {
            display: flex;
            gap: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .message-input {
            flex: 1;
            padding: 1rem 1.25rem;
            border: 2px solid var(--border-color);
            border-radius: 2rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            min-height: 44px;
        }
        
        .message-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(205, 62, 81, 0.1);
        }
        
        .send-button {
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-medium);
            min-width: 44px;
        }
        
        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-large);
        }
        
        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Welcome message */
        .welcome-message {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }
        
        .welcome-message i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        /* Typing animation */
        .typing .dots {
            animation: typing 1.4s infinite;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* Screen reader only styles */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        .sr-only:focus {
            position: static;
            width: auto;
            height: auto;
            padding: 0.5rem;
            margin: 0;
            overflow: visible;
            clip: auto;
            white-space: normal;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 0.25rem;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .chat-header { 
                padding: 1rem; 
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .chat-header h1 { font-size: 1.25rem; }
            .back-to-home { 
                padding: 0.4rem 0.8rem; 
                font-size: 0.9rem; 
            }
            .theme-toggle-chat {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }
            .chat-messages { padding: 1rem; }
            .chat-input-container { padding: 1rem; }
            .message { max-width: 90%; }
            .message-content { padding: 0.75rem 1rem; }
        }
    </style>
</head>

<body>
    <!-- Skip navigation for accessibility -->
    <a href="#main-content" class="sr-only">Skip to main content</a>
    
    <!-- Chat Header with Back Button and Theme Toggle -->
    <header class="chat-header" role="banner">
        <h1>
            <i class="fas fa-robot" aria-hidden="true"></i>
            AskBot Chat
        </h1>
        
        <div style="display: flex; gap: 1rem; align-items: center;">
            <!-- Theme Toggle Button -->
            <button class="theme-toggle-chat" id="themeToggleChat" aria-label="Toggle dark/light theme">
                <i class="fas fa-sun" id="sunIconChat" aria-hidden="true"></i>
                <i class="fas fa-moon" id="moonIconChat" aria-hidden="true" style="display: none;"></i>
            </button>
            
            <!-- Back to Home Button -->
            <a href="index.html" class="back-to-home" aria-label="Return to homepage">
                <i class="fas fa-home" aria-hidden="true"></i>
                Back to Home
            </a>
        </div>
    </header>

    <!-- Main Chat Container -->
    <main id="main-content" class="chat-container" role="main">
        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Chat conversation">
            <div class="welcome-message">
                <i class="fas fa-robot" aria-hidden="true"></i>
                <h2>Welcome to AskBot Chat!</h2>
                <p>I'm here to help answer your questions. Type a message below to get started.</p>
            </div>
        </div>
        
        <!-- Input Area -->
        <div class="chat-input-container">
            <div class="chat-input">
                <label for="messageInput" class="sr-only">Enter your message</label>
                <input 
                    type="text" 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="Type your message here..."
                    autocomplete="off"
                    aria-label="Enter your message"
                    maxlength="1000"
                >
                <button id="sendButton" class="send-button" aria-label="Send message">
                    <i class="fas fa-paper-plane" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- 🌙 Dark Mode JavaScript -->
    <script>
        // ====== DARK MODE FUNCTIONALITY ======
        function initializeTheme() {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const isDark = savedTheme === "dark" || (!savedTheme && prefersDark);
            
            updateThemeUI(isDark);
        }
        
        function updateThemeUI(isDark) {
            const body = document.body;
            const html = document.documentElement;
            const sunIcon = document.getElementById('sunIconChat');
            const moonIcon = document.getElementById('moonIconChat');
            
            if (isDark) {
                body.classList.add('dark-mode');
                html.classList.add('dark-mode');
                if (sunIcon) sunIcon.style.display = 'none';
                if (moonIcon) moonIcon.style.display = 'block';
            } else {
                body.classList.remove('dark-mode');
                html.classList.remove('dark-mode');
                if (sunIcon) sunIcon.style.display = 'block';
                if (moonIcon) moonIcon.style.display = 'none';
            }
        }
        
        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-mode');
            const newTheme = isDark ? 'light' : 'dark';
            
            localStorage.setItem("theme", newTheme);
            updateThemeUI(!isDark);
        }
        
        // Initialize theme on page load
        document.addEventListener("DOMContentLoaded", () => {
            initializeTheme();
            
            // Setup theme toggle
            const themeToggle = document.getElementById('themeToggleChat');
            if (themeToggle) {
                themeToggle.addEventListener('click', toggleTheme);
            }
            
            // Initialize chat functionality
            initializeChat();
        });
        
        // ====== CHAT FUNCTIONALITY ======
        const BASE_URL = "https://askbot-backend-cfl7.onrender.com";
        let isTyping = false;

        // DOM Elements
        const messagesContainer = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function initializeChat() {
            // Event listeners
            if (sendButton) {
                sendButton.addEventListener("click", sendMessage);
            }
            
            if (messageInput) {
                messageInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
                
                // Focus on input
                messageInput.focus();
            }
            
            // Add initial bot greeting
            setTimeout(() => {
                addMessage("Hello! I'm AskBot, your AI assistant. How can I help you today?", "bot");
            }, 1000);
        }

        // Send Message Function
        async function sendMessage() {
            const input = messageInput.value.trim();
            if (!input || isTyping) return;

            // Add user message
            addMessage(input, "user");
            
            // Clear input and disable button
            messageInput.value = "";
            setTypingState(true);

            // Show typing indicator
            const typingMessage = addMessage("Typing...", "bot", true);

            try {
                // Get AI response
                const response = await generateAIResponse(input);
                
                // Remove typing indicator
                if (typingMessage && typingMessage.parentNode) {
                    typingMessage.remove();
                }
                
                // Add bot response
                addMessage(response, "bot");
            } catch (error) {
                // Remove typing indicator
                if (typingMessage && typingMessage.parentNode) {
                    typingMessage.remove();
                }
                
                // Show error message
                addMessage("❌ Sorry, I'm having trouble connecting right now. Please try again.", "bot");
                console.error("Chat error:", error);
            }
            
            setTypingState(false);
        }

        // Add Message to Chat
        function addMessage(content, sender, isTyping = false) {
            if (!messagesContainer) return null;
            
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender}-message`;
            
            const icon = document.createElement("i");
            icon.className = sender === "bot" ? "fas fa-robot" : "fas fa-user";
            
            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.textContent = content;
            
            messageDiv.appendChild(icon);
            messageDiv.appendChild(contentDiv);
            
            // Add typing animation for bot
            if (isTyping && sender === "bot") {
                messageDiv.classList.add("typing");
                contentDiv.innerHTML = 'Typing<span class="dots">...</span>';
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            return messageDiv;
        }

        // Set typing state
        function setTypingState(typing) {
            isTyping = typing;
            if (sendButton) sendButton.disabled = typing;
            if (messageInput) messageInput.disabled = typing;
            
            if (sendButton) {
                if (typing) {
                    sendButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                } else {
                    sendButton.innerHTML = '<i class="fas fa-paper-plane"></i>';
                }
            }
            
            if (messageInput && !typing) {
                messageInput.focus();
            }
        }

        // Generate AI Response
        async function generateAIResponse(userInput) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);
            
            try {
                const response = await fetch(`${BASE_URL}/generate`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ 
                        messages: [{ role: "user", content: userInput }] 
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                return data.reply || "I'm having trouble understanding. Could you try rephrasing?";
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }
    </script>
</body>
</html>
