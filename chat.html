<head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#cd3e51">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "AskBot Chat Interface",
        "description": "Interactive AI chat interface powered by Google Gemini technology",
        "url": "https://askbot-2-o.vercel.app/chat.html",
        "isPartOf": {
            "@type": "WebSite",
            "name": "AskBot",
            "url": "https://askbot-2-o.vercel.app"
        },
        "author": {
            "@type": "Person",
            "name": "Karthik",
            "affiliation": "MSRIT Bangalore"
        }
    }
    </script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* Chat-specific styles */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            background: var(--gradient-primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-medium);
        }
        
        .chat-header h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .back-to-home {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .back-to-home:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
            color: white;
            text-decoration: none;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 1rem;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--bg-secondary);
        }
        
        .message {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            max-width: 80%;
        }
        
        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .bot-message {
            align-self: flex-start;
        }
        
        .message i {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .bot-message i {
            background: var(--gradient-primary);
            color: white;
        }
        
        .user-message i {
            background: var(--gradient-secondary);
            color: white;
        }
        
        .message-content {
            background: var(--bg-primary);
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            color: var(--text-primary);
            line-height: 1.5;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-color);
        }
        
        .user-message .message-content {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .chat-input-container {
            padding: 1.5rem;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
        }
        
        .chat-input {
            display: flex;
            gap: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .message-input {
            flex: 1;
            padding: 1rem 1.25rem;
            border: 2px solid var(--border-color);
            border-radius: 2rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            min-height: 44px; /* Touch-friendly */
        }
        
        .message-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(205, 62, 81, 0.1);
        }
        
        .send-button {
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-medium);
            min-width: 44px; /* Touch-friendly */
        }
        
        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-large);
        }
        
        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Welcome message */
        .welcome-message {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }
        
        .welcome-message i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        /* Typing animation */
        .typing .dots {
            animation: typing 1.4s infinite;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .chat-header { padding: 1rem; }
            .chat-header h1 { font-size: 1.25rem; }
            .back-to-home { padding: 0.4rem 0.8rem; font-size: 0.9rem; }
            .chat-messages { padding: 1rem; }
            .chat-input-container { padding: 1rem; }
            .message { max-width: 90%; }
            .message-content { padding: 0.75rem 1rem; }
        }
    </style>
</head>

<body>
    <!-- Skip navigation for accessibility -->
    <a href="#main-content" class="sr-only">Skip to main content</a>
    
    <!-- Chat Header with Back Button -->
    <header class="chat-header" role="banner">
        <h1>
            <i class="fas fa-robot" aria-hidden="true"></i>
            AskBot Chat
        </h1>
        <a href="index.html" class="back-to-home" aria-label="Return to homepage">
            <i class="fas fa-home" aria-hidden="true"></i>
            Back to Home
        </a>
    </header>

    <!-- Main Chat Container -->
    <main id="main-content" class="chat-container" role="main">
        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Chat conversation">
            <div class="welcome-message">
                <i class="fas fa-robot" aria-hidden="true"></i>
                <h2>Welcome to AskBot Chat!</h2>
                <p>I'm here to help answer your questions. Type a message below to get started.</p>
            </div>
        </div>
        
        <!-- Input Area -->
        <div class="chat-input-container">
            <div class="chat-input">
                <label for="messageInput" class="sr-only">Enter your message</label>
                <input 
                    type="text" 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="Type your message here..."
                    autocomplete="off"
                    aria-label="Enter your message"
                    maxlength="1000"
                >
                <button id="sendButton" class="send-button" aria-label="Send message">
                    <i class="fas fa-paper-plane" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Chat Script -->
    <script src="chat-script.js"></script>
    
    <!-- Screen reader support CSS -->
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        .sr-only:focus {
            position: static;
            width: auto;
            height: auto;
            padding: 0.5rem;
            margin: 0;
            overflow: visible;
            clip: auto;
            white-space: normal;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 0.25rem;
        }
    </style>
</body>
</html>
