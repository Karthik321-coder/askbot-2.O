<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskBot Premium Chat</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <!-- Payment Section (shown first) -->
    <div id="paymentSection" class="payment-container">
        <div class="payment-card">
            <h1>🚀 AskBot 24-Hour Pass</h1>
            <div class="features">
                <p>✅ Unlimited questions</p>
                <p>✅ Priority responses</p>
                <p>✅ No rate limits</p>
                <p>✅ 24/7 availability</p>
            </div>
            <div class="price">₹49</div>
            <button id="payButton" class="pay-btn">
                💳 Pay with UPI / Card
            </button>
            <p class="secure">🔒 Secure payment powered by Razorpay</p>
        </div>
    </div>

    <!-- Chat Section (hidden initially) -->
    <div id="chatSection" class="chat-container" style="display:none;">
        <div class="chat-header">
            <h2>AskBot Premium Chat</h2>
            <div class="time-remaining" id="timeRemaining"></div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Ask anything...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="paid-chat.js"></script>
</body>
</html>
