<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskBot Premium Chat</title>
    <link rel="stylesheet" href="styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <style>
        /* Advanced Payment Interface Styling */
        .advanced-payment-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .advanced-payment-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
        }

        .advanced-payment-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .premium-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .premium-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        .premium-header .subtitle {
            color: #666;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .premium-features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.05) 100%);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .feature-text {
            font-weight: 600;
            color: #333;
        }

        .pricing-section {
            text-align: center;
            margin: 2rem 0;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            border-radius: 20px;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }

        .price-display {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .price-duration {
            font-size: 1.2rem;
            color: #666;
            font-weight: 600;
        }

        .advanced-pay-button {
            width: 100%;
            padding: 1.5rem 2rem;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0 1rem 0;
            position: relative;
            overflow: hidden;
        }

        .advanced-pay-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .advanced-pay-button:hover::before {
            left: 100%;
        }

        .advanced-pay-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
        }

        .security-badges {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .floating-circle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-circle:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-circle:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Back to Home for Payment Page */
        .back-home {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .back-home:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        /* Simple Chat Interface (keeping original colors) */
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.2rem;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .message.bot {
            background: white;
            color: #374151;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid #e5e7eb;
        }

        .chat-input {
            display: flex;
            padding: 1.5rem;
            background: white;
            border-top: 1px solid #e5e7eb;
            gap: 0.75rem;
        }

        .chat-input input {
            flex: 1;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .advanced-payment-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .premium-features-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .price-display {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Back to Home Button -->
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- Advanced Payment Section (shown first) -->
    <div id="paymentSection" class="advanced-payment-container">
        <!-- Floating Background Elements -->
        <div class="floating-elements">
            <div class="floating-circle"></div>
            <div class="floating-circle"></div>
            <div class="floating-circle"></div>
        </div>

        <div class="advanced-payment-card">
            <div class="premium-header">
                <h1><i class="fas fa-crown"></i> AskBot Premium</h1>
                <p class="subtitle">Unlock unlimited AI-powered conversations</p>
            </div>

            <div class="premium-features-grid">
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-infinity"></i>
                    </div>
                    <div class="feature-text">Unlimited Questions</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-rocket"></i>
                    </div>
                    <div class="feature-text">Priority Responses</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div class="feature-text">No Rate Limits</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="feature-text">24/7 Availability</div>
                </div>
            </div>

            <div class="pricing-section">
                <div class="price-display">₹49</div>
                <div class="price-duration">24-Hour Access Pass</div>
            </div>

            <button id="payButton" class="advanced-pay-button">
                <i class="fas fa-credit-card"></i>
                Pay Securely with UPI / Card
                <i class="fas fa-arrow-right"></i>
            </button>

            <div class="security-badges">
                <div class="security-badge">
                    <i class="fas fa-lock"></i>
                    <span>SSL Secured</span>
                </div>
                <div class="security-badge">
                    <i class="fas fa-shield"></i>
                    <span>Razorpay Protected</span>
                </div>
                <div class="security-badge">
                    <i class="fas fa-check-circle"></i>
                    <span>Instant Access</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Simple Chat Section (hidden initially, keeping original design) -->
    <div id="chatSection" class="chat-container" style="display:none;">
        <div class="chat-header">
            <h2><i class="fas fa-crown"></i> AskBot Premium Chat</h2>
            <div class="time-remaining" id="timeRemaining">24:00:00</div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Ask me anything... Premium AI at your service! ✨">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>

<script>
    console.log('🚀 Testing Razorpay payment...');

    // REPLACE WITH YOUR ACTUAL RAZORPAY KEY
    const RAZORPAY_KEY = ''; // ← Must be your real key!

    document.addEventListener('DOMContentLoaded', function() {
        const payButton = document.getElementById('payButton');
        
        payButton.addEventListener('click', function() {
            console.log('💳 Pay button clicked');
            
            // Validate key first
            if (!RAZORPAY_KEY || RAZORPAY_KEY.includes('osQX0hl8dZSzOLyYlxmohzKa')) {
                alert('❌ Please add your actual Razorpay Key ID first!');
                return;
            }

            const options = {
                key: RAZORPAY_KEY,
                amount: 4900, // ₹49 in paise
                currency: 'INR',
                name: 'AskBot Premium Test',
                description: '24-Hour Access Test',
                
                handler: function (response) {
                    console.log('✅ Payment Success:', response);
                    alert('🎉 Payment Successful! ID: ' + response.razorpay_payment_id);
                    
                    // Hide payment, show chat
                    document.getElementById('paymentSection').style.display = 'none';
                    document.getElementById('chatSection').style.display = 'flex';
                },
                
                prefill: {
                    name: 'Test User',
                    email: 'test@example.com',
                    contact: '9999999999'
                },
                
                theme: {
                    color: '#667eea'
                }
            };

            try {
                const rzp = new Razorpay(options);
                
                // Handle payment failures
                rzp.on('payment.failed', function (response) {
                    console.error('❌ Payment Failed:', response.error);
                    alert('❌ Payment Failed: ' + (response.error.description || 'Unknown error'));
                });

                rzp.open();
                
            } catch (error) {
                console.error('❌ Razorpay Error:', error);
                alert('❌ Payment system error: ' + error.message);
            }
        });
    });
</script>


</body>
</html>
