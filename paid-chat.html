<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AskBot Premium Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
  /* Make the messages pane actually scroll inside flex column */
.premium-chat-container {
  min-height: 100dvh;                 /* dynamic VH fixes mobile address bar issues */
  min-height: calc(var(--vh, 1vh) * 100); /* fallback for older browsers */
  display: flex;
  flex-direction: column;
}  /* [ref] */

.premium-messages {
  min-height: 0;                       /* critical: release flex child min-size */
  overflow-y: auto;                    /* the scrolling happens here */
  -webkit-overflow-scrolling: touch;   /* smoother iOS scroll */
}  /* [ref] */

.premium-input-container {
  flex-shrink: 0;                      /* stop composer from stealing height */
}  /* [ref] */

/* If body got overflow hidden anywhere, override it */
html, body { height: 100%; overflow: auto; } /* ensure page can scroll if needed */

  :root{
    --indigo:#667eea;
    --violet:#764ba2;
    --pink:#f093fb;
    --teal:#22d3ee;
    --purple:#8b5cf6;
    --glass-bg: rgba(17,24,39,0.55);
    --glass-stroke: rgba(255,255,255,0.12);
    --text:#e5e7eb;
    --muted:#c7d2fe;
    --ring-bg:#0b1020;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  /* Background stack with aurora and particles */
  body{
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 800px at 10% -10%, rgba(34,211,238,.12) 0%, transparent 60%),
      radial-gradient(900px 700px at 110% 110%, rgba(139,92,246,.16) 0%, transparent 55%),
      linear-gradient(135deg,#0b1020 0%,#0a0f1d 45%,#0a0b14 100%);
    min-height:100vh; overflow:hidden; position:relative;
  }
  /* floating particle specks */
  body::before{
    content:'';
    position:fixed; inset:0; pointer-events:none;
    background:
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width=\"140\" height=\"140\" viewBox=\"0 0 140 140\"><g fill=\"rgba(255,255,255,.06)\"><circle cx=\"20\" cy=\"30\" r=\"1\"/><circle cx=\"80\" cy=\"22\" r=\"0.9\"/><circle cx=\"120\" cy=\"90\" r=\"0.7\"/><circle cx=\"50\" cy=\"110\" r=\"0.8\"/><circle cx=\"30\" cy=\"70\" r=\"0.7\"/></g></svg>');
    animation: drift 40s linear infinite;
    opacity:.7; mix-blend-mode:screen;
  }
  @keyframes drift{
    0%{transform:translateY(0)}
    100%{transform:translateY(-200px)}
  }

  /* Payment */
  .advanced-payment-container{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem;
    background:
      radial-gradient(800px 400px at 80% -10%, rgba(102,126,234,.18), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(240,147,251,.18), transparent 55%);
  }
  .advanced-payment-card{
    width:min(560px,92vw); text-align:center; border-radius:26px; padding:2.8rem;
    background:linear-gradient(180deg, rgba(17,24,39,.72), rgba(17,24,39,.52));
    backdrop-filter: blur(22px);
    border:1px solid var(--glass-stroke);
    box-shadow: 0 28px 66px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
    position:relative; overflow:hidden;
  }
  .advanced-payment-card::after{
    content:''; position:absolute; inset:-2px; border-radius:28px; pointer-events:none; opacity:.6;
    background: conic-gradient(from 120deg, rgba(34,211,238,.35), rgba(139,92,246,.35), rgba(240,147,251,.35), rgba(34,211,238,.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; padding:2px;
  }
  .premium-header h1{
    font-size:2.6rem; font-weight:900; letter-spacing:.3px; margin-bottom:.35rem;
    background: linear-gradient(135deg, var(--teal), var(--purple));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow: 0 6px 24px rgba(34,211,238,.18);
  }
  .price-display{ font-size:4rem; font-weight:900; color:#a5b4fc; margin:1.2rem 0 0.4rem }
  .advanced-pay-button{
    width:100%; padding:1.15rem 1.6rem; font-weight:800; font-size:1.08rem;
    border:0; border-radius:16px; color:#0b1020; cursor:pointer;
    background: linear-gradient(135deg, var(--teal) 0%, var(--purple) 100%);
    box-shadow: 0 18px 32px rgba(139,92,246,.35);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
  }
  .advanced-pay-button:hover{ transform:translateY(-2px); filter:saturate(1.05); box-shadow:0 26px 46px rgba(139,92,246,.44) }

  /* Premium Chat Shell */
  .premium-chat-container{
    min-height:100vh; display:flex; flex-direction:column; position:relative;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(34,211,238,.12), transparent 60%),
      radial-gradient(900px 700px at 110% 110%, rgba(139,92,246,.18), transparent 55%),
      linear-gradient(135deg, #0b1020 0%, #0a0f1d 45%, #0a0b14 100%);
  }

  .premium-chat-header{
    padding:1.6rem 2rem; color:#e5e7eb; display:flex; justify-content:space-between; align-items:center;
    background: linear-gradient(135deg, rgba(30,58,138,.55), rgba(76,29,149,.55));
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    position:relative; overflow:hidden;
  }
  .premium-title{display:flex;align-items:center;gap:.8rem;font-size:1.9rem;font-weight:900}
  .premium-title i{color:#facc15;text-shadow:0 2px 12px rgba(250,204,21,.35)}
  .premium-badge{
    display:flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.08);
    padding:.55rem .9rem;border-radius:28px;border:1px solid rgba(255,255,255,.14)
  }
  .timer-ring{
    --pct: 100;
    width:34px;height:34px;border-radius:50%;
    background: conic-gradient(#22d3ee calc(var(--pct)*1%), rgba(255,255,255,.12) 0);
    display:grid;place-items:center;
  }
  .timer-ring span{
    width:24px;height:24px;border-radius:50%; background:var(--ring-bg); color:#a5b4fc;
    font-size:.7rem; display:grid; place-items:center; border:1px solid rgba(255,255,255,.1)
  }

  /* Quick prompts */
  .quick-prompts{
    display:flex; gap:.6rem; padding:.75rem 1rem .2rem; flex-wrap:wrap;
  }
  .chip{
    padding:.45rem .8rem; border-radius:999px; cursor:pointer; font-weight:600; font-size:.85rem;
    color:#0b1020; background: linear-gradient(135deg, #22d3ee, #8b5cf6);
    box-shadow: 0 8px 20px rgba(34,211,238,.22); border:0;
  }
  .chip:hover{ filter: brightness(1.06) }

  /* Messages */
  .premium-messages{
    flex:1; overflow:auto; padding:1.4rem 1.4rem 1.8rem;
    display:flex; flex-direction:column; gap:1.1rem;
    background:
      radial-gradient(800px 400px at 85% -10%, rgba(99,102,241,.12), transparent 50%),
      linear-gradient(to bottom, rgba(2,6,23,.38), rgba(2,6,23,.7));
  }
  .premium-messages::-webkit-scrollbar{ width:8px }
  .premium-messages::-webkit-scrollbar-thumb{
    background: linear-gradient(180deg, #22d3ee, #8b5cf6); border-radius:8px
  }

  .premium-message{
    max-width:78%; padding:1.15rem 1.35rem; border-radius:18px; line-height:1.6; font-size:1.03rem;
    position:relative; box-shadow:0 14px 28px rgba(0,0,0,.35); animation:slideIn .35s ease both;
  }
  @keyframes slideIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)}}
  .premium-message.user{
    align-self:flex-end; color:#0b1020;
    background: linear-gradient(135deg, #22d3ee 0%, #8b5cf6 100%); border-bottom-right-radius:8px;
  }
  .premium-message.bot{
    align-self:flex-start; color:#e5e7eb; border:1px solid rgba(148,163,184,.18);
    background: rgba(15,23,42,.86); border-bottom-left-radius:8px;
  }
  .premium-message.bot::before{
    content:'🤖✨'; position:absolute; top:-10px; left:14px; font-size:1rem;
    background:rgba(2,6,23,.85); padding:0 6px; border-radius:8px; border:1px solid rgba(148,163,184,.2)
  }

  /* Message actions */
  .msg-actions{
    position:absolute; right:.45rem; bottom:.45rem; display:flex; gap:.35rem; opacity:0;
    transition:opacity .2s ease;
  }
  .premium-message:hover .msg-actions{ opacity:1 }
  .action-btn{
    width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.08); color:#c7d2fe; cursor:pointer; display:grid;place-items:center
  }
  .action-btn:hover{ background:rgba(255,255,255,.14) }

  /* Input area + toolbar */
  .premium-input-container{
    border-top:1px solid rgba(255,255,255,.08);
    background: rgba(2,6,23,.7); backdrop-filter: blur(12px);
  }
  .composer-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:.6rem;
    padding:.6rem 1rem .3rem;
  }
  .tool-group{display:flex; gap:.4rem}
  .tool-btn{
    padding:.5rem .7rem; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.08); color:#c7d2fe; font-weight:700; cursor:pointer; font-size:.9rem;
  }
  .tool-btn:hover{ background:rgba(255,255,255,.14) }

  .premium-input{display:flex; gap:.8rem; align-items:center; padding: .75rem 1rem 1.1rem}
  .premium-input input{
    flex:1; border:2px solid rgba(148,163,184,.22); border-radius:18px; padding: .9rem 1.2rem;
    outline:none; background:rgba(15,23,42,.9); color:#e5e7eb; font-size:1.02rem;
  }
  .premium-input input::placeholder{ color:rgba(226,232,240,.6) }
  .premium-input input:focus{ border-color:#60a5fa; box-shadow:0 0 0 6px rgba(59,130,246,.12) }
  .premium-send-btn{
    background: linear-gradient(135deg, var(--teal) 0%, var(--purple) 100%);
    color:#0b1020; font-weight:900; border:0; border-radius:14px; padding:.9rem 1.2rem; cursor:pointer;
    box-shadow: 0 14px 26px rgba(34,211,238,.25);
  }
  .premium-send-btn:hover{ transform: translateY(-1px) }

  /* Sidebar features */
  .premium-features{
    position: fixed; top: 50%; right: 1.2rem; transform: translateY(-50%);
    background: rgba(17,24,39,.6); border:1px solid rgba(255,255,255,.1); border-radius:16px;
    padding: 1rem .9rem; color: #e5e7eb; width: 210px; backdrop-filter: blur(12px);
  }
  .premium-features h4{ color:#feca57; margin:0 0 .7rem 0 }
  .premium-features ul{ list-style:none; display:grid; gap:.5rem; font-size:.92rem }

  /* Toast */
  .toast{
    position: fixed; left:50%; bottom:20px; transform:translateX(-50%);
    background: rgba(2,6,23,.92); color:#e5e7eb; padding:.75rem 1.1rem; border-radius:12px;
    border:1px solid rgba(255,255,255,.12); display:none; z-index:9999
  }

  /* Mobile */
  @media (max-width: 900px){ .premium-features{ display:none } }

  /* Make the chat list truly scroll inside the flex column */
.premium-chat-container {
  min-height: 100dvh;                          /* dynamic viewport to avoid 100vh bugs */
  min-height: calc(var(--vh, 1vh) * 100);      /* fallback for older browsers */
  display: flex;
  flex-direction: column;
} /* refs: flex + mobile vh */ 

.premium-messages {
  flex: 1 1 auto;                               /* give it the remaining height */
  min-height: 0;                                /* critical: release flex min-content size */
  overflow-y: auto;                             /* the scrolling happens here */
  -webkit-overflow-scrolling: touch;            /* smooth iOS scroll */
  touch-action: pan-y;                          /* ensure touch scroll is allowed */
} /* refs: flex overflow fix */ 

.premium-input-container,
.quick-prompts,
.premium-chat-header { 
  flex-shrink: 0;                               /* prevent toolbars from stealing height */
} /* layout guard */ 

/* If any global rule set overflow hidden on page, unblock it */
html, body { height: 100%; overflow: auto; }    /* allow a scroll root if needed */


  /* Keep chat readable by reserving space on large screens */
@media (min-width: 1100px) {
  .premium-messages { padding-right: 16px; } /* content first; drawer overlays */
}

/* Floating action button to toggle the features drawer */
.features-fab {
  position: fixed; right: 1.2rem; bottom: 1.2rem; z-index: 1200;
  width: 56px; height: 56px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; border: none;
  background: linear-gradient(135deg, #22d3ee 0%, #8b5cf6 100%);
  color: #0b1020; box-shadow: 0 18px 36px rgba(139,92,246,.35);
}

/* Off-canvas drawer for premium features */
.premium-features {
  position: fixed; top: 0; right: 0; height: 100dvh; width: min(320px, 86vw);
  transform: translateX(100%); transition: transform .25s ease;
  background: rgba(17,24,39,.9); color: #e5e7eb; z-index: 1150;
  border-left: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(16px);
  padding: 1rem 1rem 1.2rem;
}
.premium-features.open { transform: translateX(0); }

.premium-features .drawer-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem;
}
.premium-features .drawer-head h4 { margin: 0; color: #feca57; }

.features-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  backdrop-filter: blur(2px); z-index: 1140; display: none;
}
.features-backdrop.show { display: block; }

/* Hide drawer on small screens unless opened via FAB */
@media (max-width: 900px) {
  .premium-features { width: 88vw; }
}

</style>
</head>
<body>

<!-- Payment -->
<div id="paymentSection" class="advanced-payment-container">
  <div class="advanced-payment-card">
    <div class="premium-header">
      <h1><i class="fas fa-crown"></i> AskBot Premium</h1>
      <p style="color:#c7d2fe">Unlock unlimited AI-powered conversations</p>
    </div>

    <div class="price-display">₹11</div>
    <div style="font-size:1.05rem;color:#94a3b8;margin-bottom:1.6rem">24‑Hour Access Pass</div>

    <button id="payButton" class="advanced-pay-button">
      <i class="fas fa-credit-card"></i>&nbsp; Pay Securely with UPI / Card
    </button>

    <div style="margin-top:1.05rem;color:#94a3b8;font-size:.92rem">
      🔒 Secure payment powered by Razorpay
    </div>
  </div>
</div>

<!-- Chat -->
<div id="chatSection" class="premium-chat-container" style="display:none;">
  <div class="premium-chat-header">
    <div class="premium-title"><i class="fas fa-crown"></i> AskBot Premium</div>
    <div class="premium-badge">
      <div class="timer-ring" id="timerRing"><span id="timerMini">24</span></div>
      <span id="timeRemaining">24:00:00</span>
    </div>
  </div>

  <!-- Quick prompts -->
  <div class="quick-prompts" id="quickPrompts">
    <button class="chip">Summarize this article</button>
    <button class="chip">Generate study notes</button>
    <button class="chip">Explain like I’m 12</button>
    <button class="chip">Debug this code</button>
    <button class="chip">Create a daily plan</button>
  </div>

  <!-- Messages -->
  <div class="premium-messages" id="chatMessages"></div>

  <!-- Composer tools -->
  <div class="premium-input-container">
    <div class="composer-toolbar">
      <div class="tool-group">
        <button class="tool-btn" id="btnCopyLast"><i class="fa-regular fa-copy"></i> Copy last</button>
        <button class="tool-btn" id="btnRegen"><i class="fa-solid fa-rotate-right"></i> Regenerate</button>
        <button class="tool-btn" id="btnClear"><i class="fa-regular fa-trash-can"></i> Clear</button>
      </div>
      <div class="tool-group">
        <button class="tool-btn" id="btnExport"><i class="fa-regular fa-file-lines"></i> Export</button>
        <button class="tool-btn" id="btnHistory"><i class="fa-solid fa-clock-rotate-left"></i> History</button>
      </div>
    </div>
    <div class="premium-input">
      <input type="text" id="messageInput" placeholder="Ask me anything... I’m your premium AI assistant! ✨" autocomplete="off">
      <button type="button" id="sendBtn" class="premium-send-btn"><i class="fas fa-paper-plane"></i> Send</button>
    </div>
  </div>

<!-- Off‑canvas Premium Features Drawer -->
<div class="premium-features" id="premiumDrawer">
  <div class="drawer-head">
    <h4><i class="fas fa-crown"></i> Premium Features</h4>
    <button id="featuresClose" class="tool-btn" style="border-radius:10px"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <ul style="list-style:none; padding:0; display:grid; gap:.5rem; font-size:.95rem;">
    <li><i class="fas fa-infinity"></i> Unlimited Questions</li>
    <li><i class="fas fa-rocket"></i> Priority Processing</li>
    <li><i class="fas fa-brain"></i> Advanced AI Model</li>
    <li><i class="fas fa-clock"></i> 24/7 Availability</li>
    <li><i class="fas fa-history"></i> Chat History</li>
  </ul>
</div>
<div class="features-backdrop" id="featuresBackdrop"></div>

<!-- Floating Action Button to open drawer -->
<button class="features-fab" id="featuresFab" aria-label="Premium features">
  <i class="fa-solid fa-star"></i>
</button>


<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  console.log('🚀 AskBot Premium loading...');

  // Config
  const RAZORPAY_KEY = 'rzp_live_RBZzAH4aoPYBRg'; // replace
  const BACKEND_URL  = 'https://askbot-backend.vercel.app/'; // replace
  const PRICE_PAISE  = 1100; // ₹11

  // State
  let lastUserMessage = '';
  let lastBotMessage  = '';
  let lastRequestBody = null;

  document.addEventListener('DOMContentLoaded', () => {
    checkExistingAccess();
    setupPaymentButton();
    setupUIExtras();
  });

  // Payment
  function setupPaymentButton(){
    const payButton = document.getElementById('payButton');
    payButton.addEventListener('click', () => {
      if(!RAZORPAY_KEY || RAZORPAY_KEY === 'YOUR_RAZORPAY_KEY_ID'){
        alert('❌ Please add your actual Razorpay Key ID first!');
        return;
      }
      const options = {
        key: RAZORPAY_KEY,
        amount: PRICE_PAISE,
        currency: 'INR',
        name: 'AskBot Premium',
        description: '24-Hour Premium Access',
        handler: function (response) {
          // Save access
          localStorage.setItem('askbot_premium_access', JSON.stringify({
            paymentId: response.razorpay_payment_id,
            expiresAt: new Date(Date.now() + 24*60*60*1000),
            isPremium: true,
            timestamp: new Date().toISOString()
          }));
          confetti();
          payButton.innerHTML = '<i class="fas fa-check"></i> Payment Successful!';
          payButton.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          setTimeout(showPremiumChat, 1200);
        },
        prefill: { name: 'Premium User', email: 'user@example.com', contact: '9999999999' },
        theme:  { color: '#667eea' },
        modal:  { ondismiss: () => toast('Payment cancelled. You can try again anytime!') }
      };
      const razorpay = new Razorpay(options);
      razorpay.on('payment.failed', (r) => { console.error(r.error); alert('❌ Payment Failed: ' + r.error.description); });
      razorpay.open();
    });
  }

  function checkExistingAccess(){
    const accessData = localStorage.getItem('askbot_premium_access');
    if(accessData){
      const { expiresAt } = JSON.parse(accessData);
      if(new Date() < new Date(expiresAt)){
        showPremiumChat();
        return;
      }
      localStorage.removeItem('askbot_premium_access');
    }
  }

  function showPremiumChat(){
    document.getElementById('paymentSection').style.display = 'none';
    document.getElementById('chatSection').style.display = 'flex';
    initializePremiumChat();
  }

  // Chat
  function initializePremiumChat(){
    startCountdownTimer();
    setTimeout(()=> addMessage('bot', '🎉 Welcome to AskBot Premium! I\'m your advanced AI assistant with unlimited access to cutting-edge capabilities. Ask me anything!'), 700);
    setupChatHandlers();
    loadHistory();
  }

  function setupChatHandlers(){
    const sendBtn = document.getElementById('sendBtn');
    const input   = document.getElementById('messageInput');

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }});

    // Quick prompts
    document.getElementById('quickPrompts').addEventListener('click', (e)=>{
      if(e.target.classList.contains('chip')){
        input.value = e.target.textContent.trim();
        sendMessage();
      }
    });

    // Toolbar
    document.getElementById('btnCopyLast').onclick = copyLast;
    document.getElementById('btnRegen').onclick    = regenerateLast;
    document.getElementById('btnClear').onclick    = clearChat;
    document.getElementById('btnExport').onclick   = exportChat;
    document.getElementById('btnHistory').onclick  = loadHistory;
  }

  async function sendMessage(){
    const input   = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const msg     = input.value.trim();
    if(!msg) return;

    // Access check
    const accessData = localStorage.getItem('askbot_premium_access');
    if(!accessData){ alert('❌ Premium access required.'); return; }

    input.disabled = true; sendBtn.disabled=true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing';

    lastUserMessage = msg;
    addMessage('user', msg);
    input.value='';

    const thinkingId = addTypingIndicator();
    lastRequestBody = { message: msg, isPremium: true };

    try{
      const res = await fetch(`${BACKEND_URL}/api/chat`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(lastRequestBody)
      });
      if(!res.ok){
        const text = await res.text().catch(()=> '');
        throw new Error(`Backend error ${res.status}${text?': '+text:''}`);
      }
      const data = await res.json();
      removeTypingIndicator(thinkingId);
      const reply = data.reply || data.response || 'Sorry, I couldn\'t generate a response.';
      lastBotMessage = reply;
      addMessage('bot', reply, true);
      persistHistory();
    }catch(err){
      console.error('Chat error:', err);
      removeTypingIndicator(thinkingId);
      addMessage('bot','🚫 I encountered an issue processing your request. As a premium user, please try again in a moment.');
      toast(err.message);
    }finally{
      input.disabled = false; sendBtn.disabled=false; sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
      input.focus();
    }
  }

  function addMessage(sender, text, withActions=false){
    const wrap = document.getElementById('chatMessages');
    const div  = document.createElement('div');
    div.className = `premium-message ${sender}`;
    div.innerHTML = text.replace(/\n/g,'<br>');
    if(withActions){
      const actions = document.createElement('div');
      actions.className='msg-actions';
      actions.innerHTML=`
        <button class="action-btn" title="Copy" onclick="copyText(this)"><i class="fa-regular fa-copy"></i></button>
        <button class="action-btn" title="Regenerate" onclick="regenerateLast()"><i class="fa-solid fa-rotate"></i></button>
      `;
      div.appendChild(actions);
    }
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
  }

  function addTypingIndicator(){
    const wrap = document.getElementById('chatMessages');
    const id = 'typing_'+Date.now();
    const div = document.createElement('div');
    div.id = id; div.className='premium-message bot';
    div.innerHTML = `
      <div class="typing-indicator" style="display:flex;align-items:center;gap:.6rem">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        <span style="opacity:.8">Premium AI thinking...</span>
      </div>`;
    wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
    return id;
  }
  function removeTypingIndicator(id){ const el=document.getElementById(id); if(el) el.remove(); }

  // Toolbar actions
  function copyLast(){
    if(!lastBotMessage){ return toast('No AI message to copy'); }
    navigator.clipboard.writeText(lastBotMessage).then(()=> toast('Copied to clipboard'));
  }
  function copyText(btn){
    const msg = btn.closest('.premium-message'); 
    const txt = msg ? msg.innerText.trim() : '';
    if(!txt) return;
    navigator.clipboard.writeText(txt).then(()=> toast('Copied to clipboard'));
  }
  function regenerateLast(){
    if(!lastRequestBody){ return toast('Nothing to regenerate yet'); }
    document.getElementById('messageInput').value = lastRequestBody.message;
    sendMessage();
  }
  function clearChat(){
    document.getElementById('chatMessages').innerHTML='';
    persistHistory(true);
    toast('Chat cleared');
  }
  function exportChat(){
    const text = Array.from(document.querySelectorAll('#chatMessages .premium-message'))
      .map(el => (el.classList.contains('user')?'You: ':'AI: ') + el.innerText.trim())
      .join('\n\n');
    const blob = new Blob([text], {type:'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='askbot-premium-chat.txt'; a.click();
    URL.revokeObjectURL(a.href);
  }

  // History
  function persistHistory(clear=false){
    const key = 'askbot_premium_chat_history';
    if(clear){ localStorage.removeItem(key); return; }
    const items = Array.from(document.querySelectorAll('#chatMessages .premium-message'))
      .map(el => ({ role: el.classList.contains('user')?'user':'bot', html: el.innerHTML }));
    localStorage.setItem(key, JSON.stringify(items));
  }
  function loadHistory(){
    const key = 'askbot_premium_chat_history';
    const raw = localStorage.getItem(key);
    if(!raw) return toast('No saved history');
    try{
      const arr = JSON.parse(raw);
      const wrap = document.getElementById('chatMessages'); wrap.innerHTML='';
      arr.forEach(m => {
        const div = document.createElement('div');
        div.className = `premium-message ${m.role}`;
        div.innerHTML = m.html;
        if(m.role==='bot'){
          const actions=document.createElement('div'); actions.className='msg-actions';
          actions.innerHTML=`<button class="action-btn" title="Copy" onclick="copyText(this)"><i class="fa-regular fa-copy"></i></button>`;
          div.appendChild(actions);
        }
        wrap.appendChild(div);
      });
      wrap.scrollTop = wrap.scrollHeight;
      toast('History loaded');
    }catch(e){ console.warn(e); }
  }

  // Countdown with ring
  function startCountdownTimer(){
    const data = localStorage.getItem('askbot_premium_access'); if(!data) return;
    const { expiresAt } = JSON.parse(data);
    const timeEl = document.getElementById('timeRemaining');
    const ringEl = document.getElementById('timerRing');
    const miniEl = document.getElementById('timerMini');
    const total = new Date(expiresAt) - new Date() + 1000;

    const tick = () => {
      const now = new Date();
      const left = new Date(expiresAt) - now;
      if(left <= 0){
        timeEl.textContent = 'Expired';
        ringEl.style.setProperty('--pct', 0);
        miniEl.textContent = '0';
        localStorage.removeItem('askbot_premium_access');
        toast('Your 24‑hour access has expired');
        setTimeout(()=> location.reload(), 1500);
        return;
      }
      const h = Math.floor(left/3600000);
      const m = Math.floor((left%3600000)/60000);
      const s = Math.floor((left%60000)/1000);
      timeEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      miniEl.textContent = String(h).padStart(2,'0');
      ringEl.style.setProperty('--pct', Math.max(0, (left/total)));
      requestAnimationFrame(tick);
    };
    tick();
  }

  // UI extras
  function setupUIExtras(){
    // Toast once at start
    setTimeout(()=> toast('Welcome to Premium ✨'), 600);
  }
  function toast(msg){
    const t = document.getElementById('toast'); t.textContent = msg; t.style.display='block';
    clearTimeout(t._h); t._h = setTimeout(()=> t.style.display='none', 2200);
  }

  // Confetti (lightweight)
  function confetti(){
    const N=30;
    for(let i=0;i<N;i++){
      const s=document.createElement('span');
      s.style.position='fixed'; s.style.left=(Math.random()*100)+'%'; s.style.top='-10px';
      s.style.width='10px'; s.style.height='10px'; s.style.borderRadius='2px';
      s.style.background= ['#22d3ee','#8b5cf6','#f093fb','#facc15'][i%4];
      s.style.boxShadow='0 0 10px rgba(255,255,255,.25)';
      s.style.transform=`rotate(${Math.random()*360}deg)`;
      s.style.zIndex=9999; s.style.pointerEvents='none';
      document.body.appendChild(s);
      const dur = 1400+Math.random()*800, x = (Math.random()*200-100);
      s.animate([{transform:`translate(0,0) rotate(0deg)`},{transform:`translate(${x}px, 110vh) rotate(600deg)`}],{duration:dur,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});
      setTimeout(()=> s.remove(), dur+100);
    }
  }

</script>
</body>
