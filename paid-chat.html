<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskBot Premium Chat</title>
    <link rel="stylesheet" href="styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- 🔥 STEP 1: Include Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <style>
        /* Your advanced payment styling */
        .advanced-payment-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .advanced-payment-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .premium-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .price-display {
            font-size: 4rem;
            font-weight: 900;
            color: #667eea;
            margin: 2rem 0;
        }

        .advanced-pay-button {
            width: 100%;
            padding: 1.5rem 2rem;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .advanced-pay-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
        }

        /* Chat interface styling */
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.2rem;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .message.bot {
            background: white;
            color: #374151;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid #e5e7eb;
        }

        .chat-input {
            display: flex;
            padding: 1.5rem;
            background: white;
            border-top: 1px solid #e5e7eb;
            gap: 0.75rem;
        }

        .chat-input input {
            flex: 1;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            outline: none;
        }

        .chat-input button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
        }

        .back-home {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Back to Home Button -->
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- Advanced Payment Section -->
    <div id="paymentSection" class="advanced-payment-container">
        <div class="advanced-payment-card">
            <div class="premium-header">
                <h1><i class="fas fa-crown"></i> AskBot Premium</h1>
                <p>Unlock unlimited AI-powered conversations</p>
            </div>

            <div class="price-display">₹49</div>
            <div style="font-size: 1.2rem; color: #666; margin-bottom: 2rem;">24-Hour Access Pass</div>

            <!-- 🔥 STEP 2: This is your payment button -->
            <button id="payButton" class="advanced-pay-button">
                <i class="fas fa-credit-card"></i>
                Pay Securely with UPI / Card
            </button>

            <div style="margin-top: 1rem; color: #666; font-size: 0.9rem;">
                🔒 Secure payment powered by Razorpay
            </div>
        </div>
    </div>

    <!-- Simple Chat Section -->
    <div id="chatSection" class="chat-container" style="display:none;">
        <div class="chat-header">
            <h2><i class="fas fa-crown"></i> AskBot Premium Chat</h2>
            <div id="timeRemaining">24:00:00</div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Ask me anything... Premium AI at your service! ✨">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>

    <!-- 🔥 STEP 3: Add your JavaScript here (inside <script> tag) -->
    <script>
        console.log('🚀 AskBot Premium loading...');

        // 🔑 REPLACE THIS WITH YOUR ACTUAL RAZORPAY KEY ID
        const RAZORPAY_KEY = 'rzp_live_RBZzAH4aoPYBRg'; // ← Put your real key here!
        const BACKEND_URL = 'https://askbot-backend.vercel.app/'; // ← Your backend URL

        // 🔥 STEP 4: This is where the payment code goes
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM loaded, setting up payment...');
            
            checkExistingAccess();
            setupPaymentButton();
        });

        function setupPaymentButton() {
            const payButton = document.getElementById('payButton');
            
            payButton.addEventListener('click', function() {
                console.log('💳 Pay button clicked!');
                
                // Validate key
                if (!RAZORPAY_KEY || RAZORPAY_KEY.includes('YOUR_KEY_HERE')) {
                    alert('❌ Please add your actual Razorpay Key ID first!');
                    return;
                }

                // 🔥 THIS IS THE RAZORPAY CODE YOU ASKED ABOUT
                const options = {
                    key: RAZORPAY_KEY, // ← Your Key ID (not secret)
                    amount: 4900, // ₹49 in paise
                    currency: 'INR',
                    name: 'AskBot Premium',
                    description: '24-Hour Premium Access',
                    
                    handler: function(response) {
                        console.log('✅ Payment successful:', response.razorpay_payment_id);
                        
                        // Grant premium access locally
                        localStorage.setItem('askbot_premium_access', JSON.stringify({
                            paymentId: response.razorpay_payment_id,
                            expiresAt: new Date(Date.now() + 24 * 60 * 60 * 1000),
                            isPremium: true,
                            timestamp: new Date().toISOString()
                        }));
                        
                        // Show success and switch to chat
                        payButton.innerHTML = '<i class="fas fa-check"></i> Payment Successful!';
                        payButton.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                        
                        setTimeout(() => {
                            showPremiumChat();
                        }, 2000);
                    },
                    
                    prefill: {
                        name: 'Premium User',
                        email: 'user@example.com',
                        contact: '9999999999'
                    },
                    
                    theme: { color: '#667eea' },
                    
                    modal: {
                        ondismiss: function() {
                            console.log('Payment cancelled');
                            alert('Payment cancelled. You can try again anytime!');
                        }
                    }
                };

                // Open Razorpay payment
                const razorpay = new Razorpay(options);
                
                razorpay.on('payment.failed', function(response) {
                    console.error('❌ Payment failed:', response.error);
                    alert('❌ Payment Failed: ' + response.error.description);
                });

                razorpay.open(); // This opens the payment popup
            });
        }

        function checkExistingAccess() {
            const accessData = localStorage.getItem('askbot_premium_access');
            if (accessData) {
                const { expiresAt } = JSON.parse(accessData);
                if (new Date() < new Date(expiresAt)) {
                    showPremiumChat();
                    return;
                }
                localStorage.removeItem('askbot_premium_access');
            }
        }

        function showPremiumChat() {
            document.getElementById('paymentSection').style.display = 'none';
            document.getElementById('chatSection').style.display = 'flex';
            initializePremiumChat();
        }

        function initializePremiumChat() {
            console.log('🎉 Initializing premium chat...');
            startCountdownTimer();
            
            setTimeout(() => {
                addMessage('bot', '🎉 Welcome to AskBot Premium! You now have unlimited access for 24 hours. Ask me anything!');
            }, 1000);
            
            setupChatHandlers();
        }

        function setupChatHandlers() {
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            messageInput.focus();
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = messageInput.value.trim();

            if (!message) return;

            // Check access
            const accessData = localStorage.getItem('askbot_premium_access');
            if (!accessData) {
                alert('❌ Premium access required.');
                return;
            }

            messageInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending';

            addMessage('user', message);
            messageInput.value = '';

            const thinkingId = addMessage('bot', '💭 Premium AI thinking...', 'typing');

            try {
                // Call your backend for AI response
                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        isPremium: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`Backend error: ${response.status}`);
                }

                const data = await response.json();
                document.getElementById(thinkingId)?.remove();
                addMessage('bot', data.reply || data.response || 'No response from AI');

            } catch (error) {
                console.error('❌ Chat error:', error);
                document.getElementById(thinkingId)?.remove();
                addMessage('bot', '🚫 Connection error. Please try again.');
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
                messageInput.focus();
            }
        }

        function addMessage(sender, text, className = '') {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            const messageId = 'msg_' + Date.now();
            
            messageDiv.id = messageId;
            messageDiv.className = `message ${sender} ${className}`;
            messageDiv.textContent = text;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            return messageId;
        }

        function startCountdownTimer() {
            const accessData = localStorage.getItem('askbot_premium_access');
            if (!accessData) return;

            const { expiresAt } = JSON.parse(accessData);
            const timeRemainingElement = document.getElementById('timeRemaining');

            const updateTimer = () => {
                const now = new Date();
                const timeLeft = new Date(expiresAt) - now;

                if (timeLeft <= 0) {
                    timeRemainingElement.textContent = 'Expired';
                    localStorage.removeItem('askbot_premium_access');
                    alert('Your 24-hour access has expired.');
                    setTimeout(() => location.reload(), 2000);
                    return;
                }

                const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                timeRemainingElement.textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            };

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        console.log('✅ AskBot Premium ready!');
    </script>
</body>
</html>
