    <!-- 🔥 FIXED: Enhanced JavaScript for Button Functionality -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 🔥 FIX: Connect "Start Chatting" button to chat.html
        const startChatButton = document.getElementById('startChatting');
        if (startChatButton) {
            startChatButton.addEventListener('click', function() {
                console.log('Navigating to chat page...');
                window.location.href = 'chat.html';
            });
        }
        
        // Fix embedded chatbox toggle (for popup version)
        const chatToggle = document.getElementById('chatbotToggle');
        const chatContainer = document.getElementById('chatbotContainer');
        if (chatToggle && chatContainer) {
            chatToggle.addEventListener('click', function() {
                chatContainer.classList.toggle('active');
                
                // Update toggle icon
                const icon = chatToggle.querySelector('i');
                if (chatContainer.classList.contains('active')) {
                    icon.className = 'fas fa-times';
                } else {
                    icon.className = 'fas fa-comments';
                }
            });
        }
        
        // Fix minimize chat button
        const minimizeButton = document.getElementById('minimizeChat');
        if (minimizeButton && chatContainer) {
            minimizeButton.addEventListener('click', function() {
                chatContainer.classList.remove('active');
                
                // Reset toggle icon
                const toggleIcon = chatToggle?.querySelector('i');
                if (toggleIcon) {
                    toggleIcon.className = 'fas fa-comments';
                }
            });
        }
        
        // Fix dark mode toggle
        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                
                // Update theme icons
                const sunIcon = document.getElementById('sun-icon');
                const moonIcon = document.getElementById('moon-icon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.style.display = 'none';
                        moonIcon.style.display = 'block';
                    } else {
                        sunIcon.style.display = 'block';
                        moonIcon.style.display = 'none';
                    }
                }
            });
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark-mode');
            
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');
            if (sunIcon && moonIcon) {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        }
    });
    </script>
