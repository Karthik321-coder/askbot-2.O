<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Keeper AI - Your Aquarium & Water Care Assistant</title>
    <meta name="description" content="Aqua Keeper AI is a specialized chatbot for aquarium enthusiasts. Get expert advice on fish care, water parameters, tank setup, and aquatic plant maintenance.">
    <meta name="keywords" content="aquarium AI, fish care chatbot, water keeper, aquatic assistant, tank setup, fish health">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://askbot-2-o.vercel.app/aqua-keeper.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Aqua Keeper AI - Aquarium & Water Care Assistant">
    <meta property="og:description" content="Expert AI guidance for aquarium hobbyists. Ask about fish care, water chemistry, tank setup, and more.">
    <meta property="og:url" content="https://askbot-2-o.vercel.app/aqua-keeper.html">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background:
                radial-gradient(1200px 800px at 10% -10%, rgba(6, 182, 212, 0.18) 0%, transparent 60%),
                radial-gradient(900px 700px at 110% 110%, rgba(20, 184, 166, 0.22) 0%, transparent 55%),
                linear-gradient(135deg, #04111a 0%, #060f1c 40%, #040d14 100%);
            color: #e5e7eb;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">\
                <defs><pattern id="n" width="100" height="100" patternUnits="userSpaceOnUse">\
                <circle cx="10" cy="20" r="0.4" fill="rgba(6,182,212,0.06)"/>\
                <circle cx="30" cy="40" r="0.3" fill="rgba(20,184,166,0.05)"/>\
                <circle cx="70" cy="15" r="0.35" fill="rgba(6,182,212,0.05)"/>\
                <circle cx="90" cy="80" r="0.25" fill="rgba(20,184,166,0.04)"/>\
                </pattern></defs><rect width="100" height="100" fill="url(%23n)"/></svg>');
            mix-blend-mode: screen;
            opacity: 0.7;
        }

        .back-home {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.06);
            color: #67e8f9;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(103, 232, 249, 0.22);
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }
        .back-home:hover {
            background: linear-gradient(135deg, #06b6d4 0%, #14b8a6 100%);
            color: #04111a;
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(6, 182, 212, 0.35);
        }

        .chat-container {
            max-width: 900px;
            margin: 2rem auto;
            height: calc(100vh - 4rem);
            display: flex;
            flex-direction: column;
            background: rgba(4, 20, 30, 0.65);
            border-radius: 20px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(22px);
            overflow: hidden;
            border: 1px solid rgba(6, 182, 212, 0.15);
            position: relative;
        }

        .chat-container::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(6,182,212,0.3), rgba(20,184,166,0.3));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
        }

        .chat-header {
            background:
                linear-gradient(135deg, rgba(8, 51, 68, 0.7) 0%, rgba(19, 78, 74, 0.7) 100%);
            color: #e5e7eb;
            padding: 1.6rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(6, 182, 212, 0.15);
        }
        .chat-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(600px 220px at -10% -40%, rgba(6,182,212,0.25), transparent 60%),
                radial-gradient(500px 200px at 120% 140%, rgba(20,184,166,0.25), transparent 60%);
            opacity: 0.7;
        }
        .chat-header h2 {
            font-size: 1.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }
        .chat-header .status {
            background: rgba(255, 255, 255, 0.08);
            color: #67e8f9;
            padding: 0.55rem 1.1rem;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(103, 232, 249, 0.2);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.8rem;
            background:
                radial-gradient(800px 400px at 85% -10%, rgba(6,182,212,0.1), transparent 50%),
                linear-gradient(to bottom, rgba(2,10,18,0.35), rgba(2,10,18,0.65));
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .chat-messages::-webkit-scrollbar { width: 8px; }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(6, 182, 212, 0.08);
            border-radius: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #06b6d4, #14b8a6);
            border-radius: 4px;
        }

        .message {
            max-width: 75%;
            padding: 1.05rem 1.3rem;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            animation: messageSlide 0.35s ease;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
        }
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #06b6d4 0%, #14b8a6 100%);
            color: #04111a;
            align-self: flex-end;
            border-bottom-right-radius: 8px;
        }
        .message.user::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid #14b8a6;
            border-bottom: 8px solid transparent;
        }

        .message.bot {
            background: rgba(4, 20, 35, 0.9);
            color: #e5e7eb;
            align-self: flex-start;
            border-bottom-left-radius: 8px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }
        .message.bot::before {
            content: '🐟';
            position: absolute;
            top: -10px;
            left: 14px;
            background: rgba(2,10,18,0.85);
            padding: 0 6px;
            font-size: 1.1rem;
            border-radius: 6px;
            border: 1px solid rgba(6,182,212,0.25);
        }
        .message.bot::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -8px;
            width: 0;
            height: 0;
            border-right: 8px solid rgba(4,20,35,0.9);
            border-bottom: 8px solid transparent;
        }

        .message.typing {
            opacity: 0.9;
            font-style: italic;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }

        .chat-input {
            display: flex;
            padding: 1.6rem;
            background: rgba(2, 10, 18, 0.75);
            border-top: 1px solid rgba(6, 182, 212, 0.1);
            gap: 1rem;
            align-items: center;
            backdrop-filter: blur(12px);
        }
        .chat-input input {
            flex: 1;
            border: 2px solid rgba(6, 182, 212, 0.22);
            border-radius: 25px;
            padding: 0.95rem 1.3rem;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
            background: rgba(4, 20, 35, 0.8);
            color: #e5e7eb;
        }
        .chat-input input::placeholder { color: rgba(103, 232, 249, 0.5); }
        .chat-input input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 6px rgba(6, 182, 212, 0.12);
            background: rgba(4, 20, 35, 0.95);
        }

        .chat-input button {
            background: linear-gradient(135deg, #06b6d4 0%, #14b8a6 100%);
            border: none;
            color: #04111a;
            padding: 0.95rem 1.6rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 800;
            transition: all 0.25s ease;
            box-shadow: 0 10px 22px rgba(6, 182, 212, 0.25);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(20, 184, 166, 0.35);
        }
        .chat-input button:active { transform: translateY(-1px); }
        .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0 1.8rem 1rem;
            background: rgba(2, 10, 18, 0.55);
        }
        .suggestion-chip {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.25);
            color: #67e8f9;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .suggestion-chip:hover {
            background: rgba(6, 182, 212, 0.2);
            border-color: #06b6d4;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .chat-container {
                margin: 1rem;
                height: calc(100vh - 2rem);
                border-radius: 16px;
            }
            .chat-header { padding: 1.25rem 1.2rem; }
            .chat-header h2 { font-size: 1.35rem; }
            .chat-messages { padding: 1.2rem; gap: 0.9rem; }
            .message { max-width: 85%; padding: 0.9rem 1rem; }
            .chat-input { padding: 1.2rem; }
            .back-home {
                top: 1rem; left: 1rem; padding: 0.6rem 1rem; font-size: 0.8rem;
            }
            .suggestions { padding: 0 1.2rem 0.8rem; }
        }

        .loading-dots { display: inline-block; }
        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(3, end) infinite;
        }
        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
            100% { content: '.'; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="chat-container">
        <div class="chat-header">
            <h2>
                🐠 Aqua Keeper AI
            </h2>
            <div class="status">
                <i class="fas fa-circle" style="color: #10b981;"></i>
                Aquarium Expert
            </div>
        </div>

        <div class="chat-messages" id="chatBox"></div>

        <div class="suggestions" id="suggestionsBar">
            <button class="suggestion-chip" onclick="useSuggestion(this)">Best fish for beginners?</button>
            <button class="suggestion-chip" onclick="useSuggestion(this)">Ideal water pH for tropical fish</button>
            <button class="suggestion-chip" onclick="useSuggestion(this)">How to cycle a new tank?</button>
            <button class="suggestion-chip" onclick="useSuggestion(this)">Why is my fish swimming sideways?</button>
            <button class="suggestion-chip" onclick="useSuggestion(this)">Best aquatic plants for low light</button>
        </div>

        <div class="chat-input">
            <input
                type="text"
                id="userInput"
                placeholder="Ask about fish care, water chemistry, tank setup... 🐠"
                autocomplete="off"
                maxlength="500"
            >
            <button type="button" id="sendButton">
                <i class="fas fa-paper-plane"></i>
                Ask
            </button>
        </div>
    </div>

    <script src="/aqua-keeper.js"></script>
</body>
</html>
