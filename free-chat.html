<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskBot - Free Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafc; height: 100vh; }
        .back-home { position: fixed; top: 1rem; left: 1rem; z-index: 1000; background: #667eea; color: white; padding: 0.75rem 1rem; border-radius: 25px; text-decoration: none; font-weight: 600; }
        .chat-container { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: white; }
        .chat-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem; background: #f8fafc; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 80%; padding: 1rem 1.2rem; border-radius: 18px; font-size: 1rem; line-height: 1.5; animation: fadeIn 0.3s ease; }
        .message.user { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; align-self: flex-end; border-bottom-right-radius: 6px; }
        .message.bot { background: white; color: #374151; align-self: flex-start; border-bottom-left-radius: 6px; border: 1px solid #e5e7eb; }
        .message.typing { opacity: 0.7; font-style: italic; }
        .chat-input { display: flex; padding: 1.5rem; background: white; border-top: 1px solid #e5e7eb; gap: 0.75rem; }
        .chat-input input { flex: 1; border: 2px solid #e5e7eb; border-radius: 25px; padding: 0.8rem 1.2rem; font-size: 1rem; outline: none; }
        .chat-input input:focus { border-color: #667eea; }
        .chat-input button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; padding: 0.8rem 1.5rem; border-radius: 25px; cursor: pointer; font-size: 1rem; }
        .chat-input button:hover { transform: translateY(-2px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">← Back to Home</a>

    <div class="chat-container">
        <div class="chat-header">
            <h2>🤖 AskBot Free Chat</h2>
            <div>Free Version</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                👋 Hi! I'm AskBot Free. Ask me anything and I'll help you out!
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
            <button type="button" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        console.log('🚀 Free chat loading...');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM loaded');
            
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');

            if (!sendBtn || !messageInput) {
                console.error('❌ Elements not found!');
                return;
            }

            console.log('✅ Elements found');

            // Send button click
            sendBtn.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('🔴 Send button clicked!');
                sendMessage();
            });

            // Enter key press
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    console.log('🔴 Enter key pressed!');
                    sendMessage();
                }
            });

            console.log('✅ Event listeners attached');
        });

        function sendMessage() {
            console.log('📤 sendMessage function called');
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                console.log('⚠️ Empty message');
                return;
            }

            console.log('📝 Message:', message);

            // Add user message
            addMessage('user', message);
            input.value = '';

            // Add thinking message
            const thinkingId = addMessage('bot', '💭 Thinking...', 'typing');

            // Try backend connection
            connectToBackend(message, thinkingId);
        }

        async function connectToBackend(message, thinkingId) {
            try {
                console.log('🌐 Connecting to backend...');
                
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, isPremium: false })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                console.log('📥 Backend response:', data);
                
                document.getElementById(thinkingId)?.remove();
                addMessage('bot', data.response || data.reply || data.answer);

            } catch (error) {
                console.log('❌ Backend error:', error);
                
                document.getElementById(thinkingId)?.remove();
                addMessage('bot', `🤖 I got your message: "${message}". My backend isn't connected yet, but I'm working on it! Try the premium version for full AI functionality.`);
            }
        }

        function addMessage(sender, text, className = '') {
            const container = document.getElementById('chatMessages');
            const messageId = 'msg_' + Date.now();
            
            const div = document.createElement('div');
            div.id = messageId;
            div.className = `message ${sender} ${className}`;
            div.textContent = text;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            
            console.log(`💬 Added ${sender}: ${text}`);
            return messageId;
        }
    </script>
</body>
</html>
