<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskBot - Free Chat</title>
    <link rel="stylesheet" href="styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
        }

        .back-home {
            position: fixed;
            top: 1rem;
            left: 1rem;
            background: rgba(255,255,255,0.95);
            color: #667eea;
            padding: 0.75rem 1rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid #667eea;
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .back-home:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }

        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.3rem;
        }

        .time-remaining {
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.2rem;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 2px 8px rgba(102,126,234,0.2);
        }

        .message.bot {
            background: white;
            color: #374151;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .message.typing {
            opacity: 0.7;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .chat-input {
            display: flex;
            padding: 1.5rem;
            background: white;
            border-top: 1px solid #e5e7eb;
            gap: 0.75rem;
        }

        .chat-input input {
            flex: 1;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .chat-input button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }

        .chat-input button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Back to Home Button -->
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- Chat Interface -->
    <div class="chat-container">
        <div class="chat-header">
            <h2><i class="fas fa-comments"></i> AskBot Free Chat</h2>
            <div class="time-remaining">Free Version</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                👋 Hi! I'm AskBot Free. Ask me anything and I'll help you out!
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Ask me anything..." autocomplete="off">
            <button type="button" id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>

    <script>
        console.log('Free chat script loading...');
        
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing chat...');
            initializeChat();
        });

        function initializeChat() {
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');

            if (!sendBtn) {
                console.error('Send button not found!');
                return;
            }

            if (!messageInput) {
                console.error('Message input not found!');
                return;
            }

            console.log('Elements found, adding event listeners...');

            // Add click event to send button
            sendBtn.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Send button clicked');
                sendMessage();
            });

            // Add enter key event to input
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    console.log('Enter key pressed');
                    sendMessage();
                }
            });

            console.log('Chat initialized successfully!');
        }

        async function sendMessage() {
            console.log('sendMessage function called');
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                console.log('Empty message, not sending');
                return;
            }

            console.log('Sending message:', message);

            // Add user message
            addMessage('user', message);
            input.value = '';

            // Add typing indicator
            const typingId = addMessage('bot', '💭 Thinking...', 'typing');

            try {
                // Try to connect to backend
                console.log('Attempting to connect to backend...');
                
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        isPremium: false 
                    })
                });

                console.log('Backend response status:', response.status);

                if (!response.ok) {
                    throw new Error(`Backend error: ${response.status}`);
                }

                const data = await response.json();
                console.log('Backend response data:', data);
                
                // Remove typing indicator
                const typingElement = document.getElementById(typingId);
                if (typingElement) typingElement.remove();
                
                // Add AI response
                const aiResponse = data.response || data.reply || data.answer || 'I received your message but couldn\'t generate a response.';
                addMessage('bot', aiResponse);

            } catch (error) {
                console.error('Error:', error);
                
                // Remove typing indicator
                const typingElement = document.getElementById(typingId);
                if (typingElement) typingElement.remove();
                
                // Add error message
                addMessage('bot', `🤖 Sorry, I'm having trouble connecting to my brain! Here's a simple response: "${message}" - I understand you're asking about this. My backend isn't connected yet, but I'm working on getting smarter! 🧠`);
            }
        }

        function addMessage(sender, message, className = '') {
            const chatMessages = document.getElementById('chatMessages');
            if (!chatMessages) {
                console.error('Chat messages container not found');
                return null;
            }

            const messageDiv = document.createElement('div');
            const messageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 11);
            
            messageDiv.id = messageId;
            messageDiv.className = `message ${sender} ${className}`;
            messageDiv.textContent = message;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            console.log('Message added:', sender, message);
            return messageId;
        }

        // Test function - you can call this in browser console
        function testChat() {
            console.log('Testing chat functionality...');
            addMessage('user', 'Test message');
            addMessage('bot', 'Test response');
        }
    </script>
</body>
</html>
