<!DOCTYPE html>
<html>
<head>
    <title>Working Chat Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .chat-box { border: 1px solid #ddd; height: 300px; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: #f9f9f9; }
        .message { margin: 8px 0; padding: 8px; border-radius: 8px; }
        .user { background: #007bff; color: white; text-align: right; }
        .bot { background: #e9ecef; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .input-area button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .input-area button:hover { background: #0056b3; }
        .status { color: green; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>AskBot Chat Test</h1>
    <div id="status" class="status">Loading...</div>
    <div id="chatBox" class="chat-box">
        <div class="message bot">👋 Hi! I'm AskBot. Type a message to test!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message here..." />
        <button id="sendButton" type="button">Send</button>
    </div>

    <script>
        console.log('🚀 Script loading...');

        // Wait for page to fully load
        window.addEventListener('load', function() {
            console.log('✅ Page fully loaded');
            document.getElementById('status').textContent = '✅ Ready to chat!';
            initializeChat();
        });

        function initializeChat() {
            console.log('🔧 Initializing chat...');
            
            const sendButton = document.getElementById('sendButton');
            const userInput = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');

            // Check if elements exist
            if (!sendButton) {
                console.error('❌ Send button not found!');
                return;
            }
            if (!userInput) {
                console.error('❌ Input field not found!');
                return;
            }
            if (!chatBox) {
                console.error('❌ Chat box not found!');
                return;
            }

            console.log('✅ All elements found');

            // Add click event to send button
            sendButton.onclick = function() {
                console.log('🔴 SEND BUTTON CLICKED!');
                sendMessage();
            };

            // Add Enter key support
            userInput.onkeypress = function(event) {
                if (event.key === 'Enter') {
                    console.log('🔴 ENTER KEY PRESSED!');
                    sendMessage();
                }
            };

            console.log('✅ Event listeners attached successfully');

            // Test function you can call in console
            window.testSend = function() {
                userInput.value = 'Test message';
                sendMessage();
            };
        }

        function sendMessage() {
            console.log('📤 sendMessage() function called');

            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();

            if (!message) {
                console.log('⚠️ Empty message, not sending');
                alert('Please type a message first!');
                return;
            }

            console.log('📝 Message to send:', message);

            // Add user message to chat
            addMessage('user', message);
            userInput.value = '';

            // Add bot response
            setTimeout(() => {
                addMessage('bot', `🤖 You said: "${message}". Chat is working! 🎉`);
            }, 1000);
        }

        function addMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            console.log(`💬 Added ${sender} message:`, text);
        }

        // Debug info
        console.log('📋 Debug info:');
        console.log('- Browser:', navigator.userAgent.split(' ')[0]);
        console.log('- JavaScript enabled:', typeof console !== 'undefined');
    </script>
</body>
</html>
