<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskBot - Free Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Dark cosmic gradient + subtle noise overlay */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background:
                radial-gradient(1200px 800px at 10% -10%, rgba(14, 165, 233, 0.18) 0%, transparent 60%),
                radial-gradient(900px 700px at 110% 110%, rgba(139, 92, 246, 0.22) 0%, transparent 55%),
                linear-gradient(135deg, #0b1020 0%, #0a0f1d 40%, #0a0b14 100%);
            color: #e5e7eb;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* starry/film grain */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">\
                <defs><pattern id="n" width="100" height="100" patternUnits="userSpaceOnUse">\
                <circle cx="10" cy="20" r="0.4" fill="rgba(255,255,255,0.05)"/>\
                <circle cx="30" cy="40" r="0.3" fill="rgba(255,255,255,0.04)"/>\
                <circle cx="70" cy="15" r="0.35" fill="rgba(255,255,255,0.04)"/>\
                <circle cx="90" cy="80" r="0.25" fill="rgba(255,255,255,0.04)"/>\
                </pattern></defs><rect width="100" height="100" fill="url(%23n)"/></svg>');
            mix-blend-mode: screen;
            opacity: 0.6;
        }

        .back-home {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.06);
            color: #a5b4fc;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(165, 180, 252, 0.22);
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }
        .back-home:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: #0b1020;
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(59, 130, 246, 0.35);
        }

        .chat-container {
            max-width: 900px;
            margin: 2rem auto;
            height: calc(100vh - 4rem);
            display: flex;
            flex-direction: column;
            background: rgba(17, 24, 39, 0.58);          /* slate-900 with opacity */
            border-radius: 20px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(22px);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }
        /* subtle neon rim */
        .chat-container::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(59,130,246,0.28), rgba(139,92,246,0.28));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
        }

        .chat-header {
            background:
                linear-gradient(135deg, rgba(30, 58, 138, 0.55) 0%, rgba(76, 29, 149, 0.55) 100%);
            color: #e5e7eb;
            padding: 1.6rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .chat-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(600px 220px at -10% -40%, rgba(59,130,246,0.25), transparent 60%),
                radial-gradient(500px 200px at 120% 140%, rgba(139,92,246,0.25), transparent 60%);
            opacity: 0.7;
        }
        .chat-header h2 {
            font-size: 1.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }
        .chat-header .status {
            background: rgba(255, 255, 255, 0.08);
            color: #c7d2fe;
            padding: 0.55rem 1.1rem;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.8rem;
            background:
                radial-gradient(800px 400px at 85% -10%, rgba(99,102,241,0.12), transparent 50%),
                linear-gradient(to bottom, rgba(2,6,23,0.35), rgba(2,6,23,0.65));
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .chat-messages::-webkit-scrollbar { width: 8px; }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(148, 163, 184, 0.08);
            border-radius: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #22d3ee, #8b5cf6);
            border-radius: 4px;
        }

        .message {
            max-width: 75%;
            padding: 1.05rem 1.3rem;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            animation: messageSlide 0.35s ease;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
        }
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #22d3ee 0%, #8b5cf6 100%);
            color: #0a0f1d;
            align-self: flex-end;
            border-bottom-right-radius: 8px;
        }
        .message.user::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid #8b5cf6;
            border-bottom: 8px solid transparent;
        }

        .message.bot {
            background: rgba(15, 23, 42, 0.85); /* slate-900/85 */
            color: #e5e7eb;
            align-self: flex-start;
            border-bottom-left-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        .message.bot::before {
            content: '🤖';
            position: absolute;
            top: -10px;
            left: 14px;
            background: rgba(2,6,23,0.8);
            padding: 0 6px;
            font-size: 1.1rem;
            border-radius: 6px;
            border: 1px solid rgba(148,163,184,0.2);
        }
        .message.bot::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -8px;
            width: 0;
            height: 0;
            border-right: 8px solid rgba(15,23,42,0.85);
            border-bottom: 8px solid transparent;
        }

        .message.typing {
            opacity: 0.9;
            font-style: italic;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }

        .chat-input {
            display: flex;
            padding: 1.6rem;
            background: rgba(2, 6, 23, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            gap: 1rem;
            align-items: center;
            backdrop-filter: blur(12px);
        }
        .chat-input input {
            flex: 1;
            border: 2px solid rgba(148, 163, 184, 0.22);
            border-radius: 25px;
            padding: 0.95rem 1.3rem;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
            background: rgba(15, 23, 42, 0.75);
            color: #e5e7eb;
        }
        .chat-input input::placeholder { color: rgba(226, 232, 240, 0.55); }
        .chat-input input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.12);
            background: rgba(15, 23, 42, 0.9);
        }

        .chat-input button {
            background: linear-gradient(135deg, #22d3ee 0%, #8b5cf6 100%);
            border: none;
            color: #0a0f1d;
            padding: 0.95rem 1.6rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 800;
            transition: all 0.25s ease;
            box-shadow: 0 10px 22px rgba(34, 211, 238, 0.25);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(139, 92, 246, 0.35);
        }
        .chat-input button:active { transform: translateY(-1px); }
        .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .chat-container {
                margin: 1rem;
                height: calc(100vh - 2rem);
                border-radius: 16px;
            }
            .chat-header { padding: 1.25rem 1.2rem; }
            .chat-header h2 { font-size: 1.35rem; }
            .chat-messages { padding: 1.2rem; gap: 0.9rem; }
            .message { max-width: 85%; padding: 0.9rem 1rem; }
            .chat-input { padding: 1.2rem; }
            .back-home {
                top: 1rem; left: 1rem; padding: 0.6rem 1rem; font-size: 0.8rem;
            }
        }

        /* Loading animation */
        .loading-dots { display: inline-block; }
        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(3, end) infinite;
        }
        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
            100% { content: '.'; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="chat-container">
        <div class="chat-header">
            <h2>
                <i class="fas fa-robot"></i>
                AskBot Free Chat
            </h2>
            <div class="status">
                <i class="fas fa-circle" style="color: #10b981;"></i>
                Free Version
            </div>
        </div>

        <div class="chat-messages" id="chatBox"></div>

        <div class="chat-input">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask me anything... 🚀" 
                autocomplete="off"
                maxlength="500"
            >
            <button type="button" id="sendButton">
                <i class="fas fa-paper-plane"></i>
                Send
            </button>
        </div>
    </div>

    <script>
        console.log('🚀 AskBot Free Chat loading...');

        // Replace with your actual backend URL
        const BACKEND_URL = 'https://your-backend-app.vercel.app';

        // Initialize chat when page loads
        window.addEventListener('load', function() {
            console.log('✅ Page loaded, initializing AskBot...');
            initializeChat();

            // Add welcome message
            setTimeout(() => {
                addMessage('bot', '👋 Hi! I\'m AskBot Free. I\'m connected to advanced AI and ready to help you with any questions!');
            }, 800);
        });

        function initializeChat() {
            const sendButton = document.getElementById('sendButton');
            const userInput = document.getElementById('userInput');

            // Attach event listeners
            sendButton.onclick = function() {
                console.log('🔴 Send button clicked!');
                sendMessage();
            };

            userInput.onkeypress = function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    console.log('🔴 Enter key pressed!');
                    sendMessage();
                }
            };

            // Focus input
            userInput.focus();

            console.log('✅ AskBot initialized successfully');
        }

        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const message = userInput.value.trim();

            if (!message) return;

            userInput.disabled = true;
            sendButton.disabled = true;
            sendButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending';

            addMessage('user', message);
            userInput.value = '';

            const thinkingId = addMessage('bot', 'Thinking<span class="loading-dots"></span>', 'typing');

            try {
                console.log('📤 Sending message:', message);
                
                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        isPremium: false
                    })
                });

                console.log('📡 Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`Backend error ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                console.log('📥 Response data:', data);

                // Remove thinking indicator
                document.getElementById(thinkingId)?.remove();

                // Check for empty response
                if (!data.reply || data.reply.trim() === '') {
                    console.warn('⚠️ Empty reply from backend');
                    addMessage('bot', '🤖 I received your message but couldn\'t generate a response. Please try again in a moment!');
                } else {
                    console.log('✅ Adding AI response');
                    addMessage('bot', data.reply);
                }

            } catch (error) {
                console.error('❌ Full error details:', error);
                document.getElementById(thinkingId)?.remove();
                addMessage('bot', `🚫 Sorry, I encountered an error: ${error.message}. Please try again!`);
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                sendButton.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
                userInput.focus();
            }
        }

        function addMessage(sender, text, className = '') {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            const messageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            messageDiv.id = messageId;
            messageDiv.className = `message ${sender} ${className}`;
            messageDiv.innerHTML = text;  // Using innerHTML to support HTML formatting
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            console.log(`💬 Added ${sender} message`);
            return messageId;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            // Ctrl/Cmd + Enter to send
            if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                sendMessage();
            }
            
            // Escape to clear input
            if (event.key === 'Escape') {
                document.getElementById('userInput').value = '';
                document.getElementById('userInput').focus();
            }
        });

        // Debug function for console
        window.testAskBot = function(testMessage = 'Hello AskBot!') {
            document.getElementById('userInput').value = testMessage;
            sendMessage();
        };

        console.log('✅ AskBot Free Chat ready! Type testAskBot() in console to test.');
    </script>
</body>
</html>
